name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

# Отменяем предыдущий прогон при новом пуше в ту же ветку:
# не тратим минуты CI на устаревшие коммиты.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, typecheck, build
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20.x]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build
        env:
          # Публичные переменные фронтенда. Секретов здесь нет и быть не должно:
          # они попадают в JS-бандл. Реальные значения задаются в
          # Settings → Secrets and variables → Actions → Variables.
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL || 'https://placeholder.supabase.co' }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY || 'placeholder-anon-key' }}
          VITE_DEFAULT_CITY: ${{ vars.VITE_DEFAULT_CITY || 'Tallinn' }}
          VITE_DEFAULT_CURRENCY: ${{ vars.VITE_DEFAULT_CURRENCY || 'EUR' }}

      - name: Check build output
        run: |
          if [ ! -f dist/index.html ]; then
            echo "::error::dist/index.html не найден — сборка прошла, но артефакт отсутствует"
            exit 1
          fi
          echo "Размер сборки:"
          du -sh dist
          echo "Файлов: $(find dist -type f | wc -l)"

      - name: Validate SQL migrations
        run: python3 scripts/check_sql.py

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          retention-days: 7
