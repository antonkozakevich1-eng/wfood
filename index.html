<!doctype html>
<html lang="ru" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover"
    />
    <meta name="theme-color" content="#FF6B35" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#1A1614" media="(prefers-color-scheme: dark)" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="WFOOD" />
    <meta name="format-detection" content="telephone=no" />

    <title>WFOOD — Где поесть?</title>
    <meta
      name="description"
      content="WFOOD помогает выбрать, где поесть, за 10 секунд: рулетка, карта заведений рядом и ИИ-помощник."
    />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="WFOOD" />
    <meta property="og:title" content="WFOOD — Где поесть?" />
    <meta
      property="og:description"
      content="Рулетка, карта и ИИ-помощник: выбери, где поесть, за 10 секунд."
    />
    <meta property="og:image" content="/og-default.png" />
    <meta name="twitter:card" content="summary_large_image" />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <link rel="manifest" href="/manifest.webmanifest" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700;9..144,900&family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <script>
      // Тема применяется до первой отрисовки, чтобы не было вспышки белого экрана.
      (function () {
        try {
          var stored = localStorage.getItem('wfood-theme');
          var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          var theme = stored === 'light' || stored === 'dark' ? stored : prefersDark ? 'dark' : 'light';
          document.documentElement.classList.toggle('dark', theme === 'dark');
        } catch (e) {
          document.documentElement.classList.add('dark');
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      WFOOD требует JavaScript. Пожалуйста, включите его в настройках браузера.
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
